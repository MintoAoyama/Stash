name: Deploy

on:
  push:
    branches: [main]
    # Keep in sync with IGNORED_PREFIXES in src/data.ts (.github/ is left out so workflow edits still run).
    paths-ignore:
      - 'schema/**'
      - 'scripts/**'
      - 'test/**'
      - 'docs/**'
      - 'README.md'
      - '.gitignore'
  workflow_dispatch:
    inputs:
      full:
        description: Rebuild every page
        type: boolean
        default: false

# Several commits may arrive in a row; build them one at a time against the latest output.
concurrency:
  group: deploy-stash
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    # A manual run may pick any branch; only main is published here (other branches: the preview workflow).
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Generate GitHub App Token
        id: generate_token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ vars.DEPLOY_REPO_NAME }}

      - name: Checkout source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run check

      # The generator only rewrites affected pages, so build on top of the published output.
      - name: Checkout deploy repository
        uses: actions/checkout@v7
        with:
          repository: ${{ github.repository_owner }}/${{ vars.DEPLOY_REPO_NAME }}
          token: ${{ steps.generate_token.outputs.token }}
          path: site

      - name: Resolve output directory
        id: outdir
        run: echo "dir=$(node -p "require('./site.config.json').basePath.replace(/^\/+|\/+$/g, '')")" >> "$GITHUB_OUTPUT"

      - name: Build
        run: npm run build -- --out "site/${{ steps.outdir.outputs.dir }}" ${{ inputs.full && '--full' || '' }}

      - name: Commit and push
        working-directory: site
        env:
          OUT_DIR: ${{ steps.outdir.outputs.dir }}
        run: |
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add "$OUT_DIR/"
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -q -m "deploy: update $OUT_DIR from ${GITHUB_REPOSITORY}@${GITHUB_SHA::7}"
          # Other workflows may push to the same repository.
          for attempt in 1 2 3; do
            git pull --rebase -q origin main && git push origin main && exit 0
            sleep 5
          done
          exit 1
